# Cloudflare Worker that injects per-link og:image / twitter:card for shared design and agreement
# links, /designs/* and /agreements/* (incl. shared AI renders via ?scene=<slug>). Deploy with
# `wrangler deploy` from this directory. Runs on the free Workers plan. The routes put the Worker in
# front of every /designs/* and /agreements/* request on the zone.
name = "og-proposals"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Routes: intercept only the design and agreement links on the production zone. This MUST stay above [vars] —
# in TOML every key after a table header belongs to that table, so putting it below would silently
# become vars.routes and the Worker would deploy with no routes at all (never invoked).
routes = [
  { pattern = "urbangametheory.xyz/designs/*", zone_name = "urbangametheory.xyz" },
  { pattern = "urbangametheory.xyz/agreements/*", zone_name = "urbangametheory.xyz" }
]

# API_BASE  = where the Worker reads design/agreement/scene JSON from (server-to-server; not WAF-blocked).
# SITE_BASE = the public site origin, used to build the /designs/<cid>/og-image.png card URL.
[vars]
API_BASE = "https://api.urbangametheory.xyz"
SITE_BASE = "https://urbangametheory.xyz"
