services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    # Mount local frontend code for live reload
    volumes:
      - ./frontend:/usr/share/nginx/html

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3000
      ENABLE_DEV_CORS: "true"
      # Compose interpolates this from the root .env; inside the container the DB host is the `db`
      # service. dotenv in backend/index.js never overrides a variable already set here.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?set COMPOSE_DATABASE_URL in the root .env}
      # No CORS_ALLOWLIST in local dev: backend only binds to localhost:3000 on the host,
      # so any localhost port (any worktree, any frontend dev server) is allowed via the
      # localhost regex in backend/index.js.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
    # Mount local backend code for live reload
    volumes:
      - ./backend:/app
      - /app/node_modules
      # backend/buildings/carve.js requires ../../frontend/js/corridor-carve.js — the ONE module
      # that decides whether a proposal demolished, cut or tunnelled under an existing building, so
      # the server and the browser cannot disagree. On the server the whole repo is checked out and
      # that relative path just works; here the backend is mounted alone at /app, so the frontend
      # sources have to be mounted at the path the require resolves to.
      - ./frontend:/frontend:ro
    # Sync deps into the mounted node_modules volume before starting nodemon.
    command: sh -c "npm install && npx nodemon server.js"

  db:
    image: my-postgis:18.6-3.6.2-ubuntu26.04
    restart: always
    # Default /dev/shm in a container is 64 MB; big parallel queries (e.g. the
    # zagreb-api veleprojekti warm query) fail with "could not resize shared
    # memory segment … No space left on device" when they hit that ceiling.
    shm_size: 1gb
    environment:
      POSTGRES_DB: consensus
      POSTGRES_USER: consensus
      # The image reads this only when it initialises an EMPTY volume (creating the superuser); an
      # existing volume ignores it and the live password is ALTER ROLE-managed. So it is not required
      # here: day-to-day runs need only COMPOSE_DATABASE_URL, and a fresh volume refuses to start
      # ("superuser password is not specified") until it is passed once, e.g.
      #   POSTGRES_PASSWORD=… docker compose up db
      # The superuser's login lives in the root .env as SUPERUSER_DATABASE_URL, a URL like every other.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_geodata_pg18:/var/lib/postgresql/data

    # jit_expressions=off: PostgreSQL 18.6 on aarch64 makes JIT-compiled expressions pathological
    # on some hash aggregates (zagreb-eojn's view: 2.5 s without, >60 s with). JIT stays on for
    # tuple deforming. Same setting as prod-de's conf.d/10-prod.conf (2026-10-16).
    command: >
      postgres
      -c max_wal_size=8GB
      -c min_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c jit_expressions=off

volumes:
  pgdata_geodata_pg18:
    external: true
    name: pgdata_geodata_pg18
