# Production vhost for the urbangametheory.xyz frontend on `do`, installed as
# /etc/nginx/sites-available/urbangametheory.xyz (sites-enabled symlinks to it). Neither deploy
# script installs it: frontend/deploy-frontend.sh only syncs the docroot and reloads nginx. This
# file is the reviewed source; apply changes by copying it over the live one (see the apply steps
# in the PR/handoff). frontend/nginx.conf is the Docker dev config, NOT this.
#
# Traffic: visitor -> Cloudflare (proxied, SSL mode "Full": origin uses the visitor's scheme, the
# origin cert is self-signed) -> this nginx.

# Plain HTTP: redirect everything to HTTPS. Cloudflare in "Full" mode forwards http:// visitors to
# :80, so without this the site answered 200 over HTTP. The ACME path stays servable in case a
# publicly-trusted origin cert is ever issued with HTTP-01. No deny-dotfiles include: nothing but
# the ACME directory is served from disk here, everything else is a redirect.
server {
    listen 80;
    listen [::]:80;
    server_name urbangametheory.xyz www.urbangametheory.xyz;

    include snippets/cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/urbangametheory.xyz;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include snippets/deny-dotfiles.conf;
    include snippets/cloudflare-realip.conf;
    include snippets/urbangametheory-headers.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name urbangametheory.xyz www.urbangametheory.xyz;

    ssl_certificate /etc/ssl/certs/urbangametheory.crt;
    ssl_certificate_key /etc/ssl/private/urbangametheory.key;

    root /var/www/urbangametheory.xyz;
    index index.html index.htm;

    location /checker-2d {
        return 301 /checker-2d/;
    }
    location /checker-2d/ {
        alias /var/www/urbangametheory.xyz-checker-2d/;
        index checker.html;
        try_files $uri $uri/ /checker.html;
        autoindex on;
    }

    location /codechecker {
        return 301 /codechecker/;
    }
    location ^~ /codechecker/ {
        alias /var/www/urbangametheory.xyz-codechecker/;
        index index.html;
        try_files $uri $uri/ /codechecker/index.html;
    }

    # Always revalidate the HTML entry so new build tokens load immediately.
    # These add their own header, which drops the server-level ones, so re-include them.
    location = / {
        include snippets/urbangametheory-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        include snippets/urbangametheory-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/terrain/ {
        proxy_pass http://127.0.0.1:3001/api/terrain/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
