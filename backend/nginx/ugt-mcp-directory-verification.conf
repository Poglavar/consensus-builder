# Public ownership proofs for free MCP directories; other dotfiles remain denied.
# Include inside the urbangametheory.xyz HTTPS server block.
location = /.well-known/mcp-registry-auth {
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /.well-known/glama.json {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
