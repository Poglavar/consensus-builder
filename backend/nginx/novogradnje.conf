# Read-only public catalogue; paths, deep links and missing assets are handled by its server.
location = /novogradnje { return 301 /novogradnje/$is_args$args; }
location ^~ /novogradnje/ {
    proxy_pass http://127.0.0.1:8490;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
