# Restore the visitor's IP behind Cloudflare. Installed as /etc/nginx/snippets/cloudflare-realip.conf
# and included by the urbangametheory.xyz and api.urbangametheory.xyz server blocks.
#
# Without it $remote_addr is a Cloudflare edge IP, so the X-Real-IP / X-Forwarded-For the API
# receives — and therefore Express's req.ip — was the edge, not the visitor: rate limits,
# MAX_MONITORS_PER_IP and area_monitor/ens_plan.creator_ip all keyed on ~dozens of CF IPs
# (verified on prod 2026-09-24: every stored creator_ip is in 162.158/15, 172.64/13, 104.16/13).
#
# CF-Connecting-IP is honoured ONLY when the TCP peer is inside a Cloudflare range below, so a
# client that connects to the origin directly cannot forge it: its header is ignored and its own
# socket address stays $remote_addr. The original edge address remains in $realip_remote_addr.
#
# Ranges fetched 2026-09-24 from https://www.cloudflare.com/ips-v4 and /ips-v6. Cloudflare changes
# them rarely; re-fetch and diff when touching this file.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
