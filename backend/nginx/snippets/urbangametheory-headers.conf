# Security headers for the urbangametheory.xyz frontend, installed as
# /etc/nginx/snippets/urbangametheory-headers.conf. Included in the server block AND in every
# location that sets its own add_header (the no-cache HTML entries), because nginx drops ALL
# inherited add_header directives in a location that declares any of its own.
#
# The API host (api.urbangametheory.xyz) does not use this: helmet() in backend/index.js already
# sends HSTS, CSP, X-Frame-Options, nosniff and Referrer-Policy there.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Nothing embeds this site (no <iframe> of it anywhere in the workspace, and the app itself
# frames nothing). The backend's embeddableStatic only relaxes Cross-Origin-Resource-Policy for
# API-hosted images, which is about <img>, not framing, so it does not apply here.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# REPORT-ONLY first (2026-09-24). The app is a large classic-script SPA: 100+ inline onclick/
# onchange handlers (so script-src needs 'unsafe-inline'), an inline importmap pulling three.js from
# jsdelivr and 3d-tiles-renderer from esm.sh, a DRACO decoder that runs WASM inside a blob: worker,
# Google Photorealistic tiles via Cesium ion, and many third-party data hosts (DGU OSS, ArcGIS,
# Overpass, Overture's building tiles, Solana/Base RPCs, IPFS). A missed host would silently break a mode, so this
# only reports to the browser console. Switch the header name to Content-Security-Policy once a
# pass through 2D, model and photo modes, proposal upload and wallet connect shows no violations.
# img-src allows any https host: tiles (OSM, MapTiler, Carto, Google), IPFS thumbnails.
# connect-src permits HTTPS because community consultation identity documents are fetched directly
# from organisers' own websites in the browser, with CORS and without credentials or a server proxy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https: wss://api.devnet.solana.com wss://api.testnet.solana.com wss://api.mainnet-beta.solana.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
