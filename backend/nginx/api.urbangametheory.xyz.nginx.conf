# Production vhost for api.urbangametheory.xyz on `do`, installed as
# /etc/nginx/sites-available/api.urbangametheory.xyz (sites-enabled symlinks to it). Not installed
# by backend/deploy-backend.sh; this file is the reviewed source and is copied over the live one by
# hand. Synced with the live file 2026-09-24 (it had drifted: deny-dotfiles include and the x402
# header buffers existed only on the server).
#
# Traffic: client -> Cloudflare (proxied, SSL "Full") -> this nginx -> node on 127.0.0.1:3000.
# Security headers come from helmet() in the app, not from here.

# Plain HTTP: redirect to HTTPS (it used to proxy and answer 200). ACME path kept servable.
server {
    listen 80;
    listen [::]:80;
    server_name api.urbangametheory.xyz;

    include snippets/cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include snippets/deny-dotfiles.conf;
    include snippets/cloudflare-realip.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.urbangametheory.xyz;

    # x402's signed Solana payment payload is carried in one request header and can exceed
    # nginx's default 8 KiB per-header buffer. Scope the larger allowance to this API only.
    large_client_header_buffers 4 32k;

    ssl_certificate /etc/ssl/certs/urbangametheory.crt;
    ssl_certificate_key /etc/ssl/private/urbangametheory.key;

    client_max_body_size 50m;

    # CORS is handled exclusively by Express (`cors()` middleware in backend/index.js).
    # Adding the headers here as well caused duplicate `Access-Control-Allow-Origin`
    # values (e.g. "https://zagreb.lol, https://zagreb.lol") which browsers reject.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Agent-discovery documents served by the app (backend/routes/well-known.js). deny-dotfiles.conf
    # claims every /.well-known/ path with an empty `^~` block that serves from disk, and this vhost
    # has no root, so these 404'd in nginx without ever reaching node. Exact-match locations win
    # over that prefix; /.well-known/acme-challenge/ and everything else stays with the snippet.
    location = /.well-known/x402 {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/security.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
