name: First-party planning diagnostics
on:
  pull_request:
    branches: [colosseum-worlds-fair]
    paths:
      - '.github/workflows/planning-diagnostics.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'docs/planning-usage-and-diagnostics.md'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            e2e/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Privacy, semantics, bounds, HTTP, UI recovery and PostgreSQL checks
        run: node --test test/planning-diagnostics*.node.test.js
        working-directory: backend
        env:
          UGT_DIAGNOSTIC_TEST_DB: postgres://postgres@127.0.0.1:5432/postgres
      - name: Build existing canvas dependency for MCP imports
        run: npm rebuild canvas
        working-directory: backend
      - name: Existing authoring, publication, import/export and MCP regressions
        run: >-
          npx vitest run
          test/design-sync.test.js test/proposal-drafts.test.js test/plan-file.test.js
          test/named-plans.test.js test/mcp-named-plans.test.js test/mcp-server.test.js
          test/share-plan-panel-contract.test.js test/busy-control.test.js
          --pool=threads --maxWorkers=2
        working-directory: backend
      - name: Install locked browser dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: File and redacted diagnostic download browser flows
        run: npx playwright test --config=playwright.plan-file.config.ts
        working-directory: e2e
