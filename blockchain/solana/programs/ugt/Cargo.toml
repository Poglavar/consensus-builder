# The ugt program: parcel anchors, design and plan records (Metaplex Core assets) and agreements in
# one Solana program (docs/blockchain-flows.md, "Chain contracts"). Replaces parcel_nft, agreement
# and proposal_nft; proposal_market and proposal_pledge read its Agreement accounts.
[package]
name = "ugt"
version = "0.1.0"
description = "Urban Game Theory - parcel anchors, design and plan records, agreements (Solana)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ugt"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Same anchor-lang line as the other programs so the workspace resolves ONE anchor version.
anchor-lang = "0.30.1"
# SAS account parsers shared with proposal_market.
sas_attestation = { path = "../../crates/sas_attestation" }

# Anchor's #[program] expands cfgs that belong to the SBF toolchain and anchor-lang, not this crate;
# declare them so rustc's check-cfg stops flagging every expansion (Anchor's recommended config).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
