[package]
name = "proposal_pledge"
version = "0.1.0"
description = "Funded USDC donations and soft pledges for consensus-builder proposals"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proposal_pledge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

# Anchor's #[program] expands cfgs that belong to the SBF toolchain and anchor-lang, not this crate;
# declare them so rustc's check-cfg stops flagging every expansion (Anchor's recommended config).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
