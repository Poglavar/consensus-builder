[package]
name = "property_offer"
version = "0.1.0"
description = "Atomic property purchase and sale escrow with lens-attested ownership"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "property_offer"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
sas_attestation = { path = "../../crates/sas_attestation" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
