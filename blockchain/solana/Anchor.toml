[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
# ugt: parcel anchors, design/plan records and agreements (programs/ugt/README.md); its keypair is
# outside the repo (~/.config/solana/program-keys/ugt.json).
ugt = "95sjeTXUYG721iZK29s3kr7Dq4eFqv6PFoEmPYJDtkp9"
proposal_market = "GDYnzduynKhKgxDhvvKVarn2s23DtzA26s6hycuUYDRB"
proposal_pledge = "1jESRS3mJiPUJTtmQ5ncyBhGNmGeXTpUqPyJcTYrp6g"

[programs.localnet]
ugt = "95sjeTXUYG721iZK29s3kr7Dq4eFqv6PFoEmPYJDtkp9"
proposal_market = "GDYnzduynKhKgxDhvvKVarn2s23DtzA26s6hycuUYDRB"
proposal_pledge = "1jESRS3mJiPUJTtmQ5ncyBhGNmGeXTpUqPyJcTYrp6g"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Genesis account for tests/proposal_pledge.ts: proposal_pledge only accepts the devnet USDC mint
# address, so the suite gets a local mint at that address with a test-only mint authority. Its
# Expired agreements are expired live by the agreement program. Regenerate with:
# node tests/fixtures/generate-pledge-fixtures.mjs
# Declaring [test.validator] makes Anchor pass --bind-address (default 0.0.0.0), which the
# agave 3.x test validator rejects at startup, so pin it to loopback.
[test.validator]
bind_address = "127.0.0.1"

[[test.validator.account]]
address = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
filename = "tests/fixtures/devnet-usdc-mint.json"

# Localnet-only mock of the Solana Attestation Service at its real program id (source in
# tests/mock_sas): the lens-model suites write SAS credential/schema/attestation bytes through it.
[[test.genesis]]
address = "22zoJMtdu4tQc2PzL74ZUT7FrwgB1Udec8DdW4yw4BdG"
program = "tests/fixtures/mock_sas.so"

# Metaplex Core at its real program id, for ugt's record assets: the devnet build, dumped by
# tests/fixtures/fetch-mpl-core.sh (gitignored, 836 KiB).
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "tests/fixtures/mpl_core.so"
