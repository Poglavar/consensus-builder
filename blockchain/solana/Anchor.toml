[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Genesis accounts for tests/proposal_pledge.ts: proposal_pledge only accepts the devnet USDC mint
# address, and its Expired-proposal cases predate settle_with_verdict, so both are loaded as local
# fixtures. Regenerate with: node tests/fixtures/generate-pledge-fixtures.mjs
# Declaring [test.validator] makes Anchor pass --bind-address (default 0.0.0.0), which the
# agave 3.x test validator rejects at startup, so pin it to loopback.
[test.validator]
bind_address = "127.0.0.1"

[[test.validator.account]]
address = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
filename = "tests/fixtures/devnet-usdc-mint.json"

[[test.validator.account]]
address = "9M5fMRR1WaaEApAcE3CbcjqmQtZY4zVH8c6bpLJgRhMt"
filename = "tests/fixtures/expired-proposal.json"

[[test.validator.account]]
address = "4JDKZWmotmffQmuwDaUdn6byxAUWCVAx9pc1eox3hXAc"
filename = "tests/fixtures/expired-escrow.json"

[[test.validator.account]]
address = "4A2bchcw3AoATmmmo2q85tsmrPjQuNE4vBZqtXujNr4i"
filename = "tests/fixtures/expired-vault.json"

[[test.validator.account]]
address = "DAdAavFG7La4ohhxDTdRXspcEzNCzVhFSkXgQkzyiXnq"
filename = "tests/fixtures/expired-position.json"

[[test.validator.account]]
address = "J9MiEM3vzZyGgTztCtwzDPmhepJ2h1UeXADFJZJNpAXq"
filename = "tests/fixtures/expired-book.json"

[[test.validator.account]]
address = "DcQ5uCvjijqCX1juMJy8XBWHhQakjGLQv3GSiU6r3oL2"
filename = "tests/fixtures/expired-commitment.json"

# A proposal_nft Proposal in the v2 layout (no site_hash/open_ground), so tests/proposal_nft.ts can
# prove v3 reads and drives accounts v2 minted. Regenerate with:
# node tests/fixtures/generate-v2-proposal-fixture.mjs
[[test.validator.account]]
address = "3Tr3MTsfVySFCUkgZyWK2B52yMY1sUH7wvRSegzAiFgC"
filename = "tests/fixtures/v2-proposal.json"

# Localnet-only mock of the Solana Attestation Service at its real program id (source in
# tests/mock_sas): the lens-model suites write SAS credential/schema/attestation bytes through it.
[[test.genesis]]
address = "22zoJMtdu4tQc2PzL74ZUT7FrwgB1Udec8DdW4yw4BdG"
program = "tests/fixtures/mock_sas.so"
