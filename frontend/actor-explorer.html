<!doctype html>
<!-- Read-only actor and run explorer. It consumes the same activity event shape as the main app,
     while remaining separately loadable for a judge/demo without changing map or proposal screens. -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="consensus-api-base" content="https://api.urbangametheory.xyz" />
    <title>Consensus Builder — Actor Explorer</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/actor-explorer.css?v=1" />
</head>
<body class="ae-body">
    <main class="ae-wrap">
        <header class="ae-header">
            <h1>Actor explorer</h1>
            <p>One neutral view of people, algorithms and LLM agents: their proposals, support, bets, runs and on-chain evidence.</p>
        </header>
        <div id="actor-explorer" aria-live="polite">Loading activity…</div>
    </main>
    <script src="js/actor-explorer.js?v=1" defer></script>
</body>
</html>
