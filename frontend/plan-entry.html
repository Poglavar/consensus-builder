<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="/">
    <title>Open plan · Consensus Builder</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/primitives.css">
    <link rel="stylesheet" href="css/page-chrome.css">
    <script src="js/browser-workspace.js"></script>

<body class="cb-page">
    <header class="cb-page-header">
        <span class="cb-page-header__brand"><img class="cb-page-header__logo" src="images/consensus-builder-logo.png" alt="" width="28" height="28"><span>Consensus Builder</span></span>
        <div class="cb-page-header__title"><h1 id="plan-arrival-heading">Open plan</h1></div>
        <a class="cb-link cb-back-link" href="/"><svg class="cb-back-link__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg><span id="plan-arrival-back">Back to the map</span></a>

    <script>WorkspaceScreen.bodyReached();</script>
    <main>
        <p role="status" id="plan-arrival-status">Loading…</p>
        <button type="button" class="btn" id="plan-arrival-retry" hidden>Try again</button>

    <script src="js/environment.js"></script>
    <script src="js/data-source.js"></script>

    <script src="vendor/ipfs-file-cid/ipfs-file-cid.js"></script>
    <script src="js/cid.js"></script>
    <script src="js/plan-record.js"></script>
    <script src="js/map-share.js"></script>

    <script src="js/chain/read-source.js"></script>
    <script src="js/chain/ipfs-read.js"></script>
    <script src="js/chain/chain-reader.js"></script>
    <script src="js/named-plans.js"></script>
    <script src="js/ui/busy-control.js"></script>
    <script type="application/json" id="plan-entry-words">{}</script>
    <script src="js/plan-entry.js"></script>
</body>
</html>
