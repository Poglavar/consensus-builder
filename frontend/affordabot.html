<!doctype html>
<!-- Affordabot's live housing research desk: bounded screening, explicit assumptions and local drafts. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affordabot · Consensus Builder</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
<link rel="stylesheet" href="css/affordabot.css?v=1">
<script defer src="js/i18n.js?v=1"></script>
<script defer src="js/affordabot-i18n.js?v=1"></script>
<script defer src="vendor/leaflet-1.9.4/leaflet.js"></script>
<script defer src="js/affordabot-model.js?v=1"></script>
<script defer src="js/affordabot.js?v=1"></script>
</head>
<body>
<header class="topbar">
<a class="brand" href="affordabot.html" aria-label="Affordabot"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="12"/><path d="M10 20 20 11l10 9v10h-7v-7h-6v7h-7Z"/></svg><span>affordabot<span class="brand-dot">.</span></span></a>
<nav class="topbar-actions"><a id="builder-link" href="index.html" data-i18n-key="affordabot.back"></a><label class="sr-only" for="language" data-i18n-key="affordabot.language"></label><select id="language"><option value="en">EN</option><option value="hr">HR</option><option value="sr">SR</option><option value="es">ES</option></select></nav>
</header>
<main class="desk">
<section class="hero"><div><p class="eyebrow" data-i18n-key="affordabot.eyebrow"></p><h1 data-i18n-key="affordabot.title"></h1><p class="lede" data-i18n-key="affordabot.lede"></p></div><aside class="mission"><span class="badge" data-i18n-key="affordabot.pilot"></span><p data-i18n-key="affordabot.mission"></p><small data-i18n-key="affordabot.draftOnly"></small></aside></section>
<section class="metrics" aria-label="Research summary"><div class="metric"><strong id="scanned-count">—</strong><span data-i18n-key="affordabot.scanned"></span></div><div class="metric"><strong id="lead-count">—</strong><span data-i18n-key="affordabot.leads"></span></div><div class="metric"><strong id="target-count">—</strong><span data-i18n-key="affordabot.withinTarget"></span></div><div class="metric"><strong id="saved-count">0</strong><span data-i18n-key="affordabot.saved"></span></div></section>
<form id="scan-form" class="card search-panel">
<div class="field"><label for="area" data-i18n-key="affordabot.area"></label><select id="area"><option value="west" data-i18n-key="affordabot.west"></option><option value="centre" data-i18n-key="affordabot.centre"></option><option value="east" data-i18n-key="affordabot.east"></option><option value="map" hidden data-i18n-key="affordabot.mapArea"></option></select></div>
<div class="field"><label for="reform-floors" data-i18n-key="affordabot.reformFloors"></label><input id="reform-floors" type="number" min="1" max="12" step="1" value="6" required></div>
<div class="field"><label for="reform-setback" data-i18n-key="affordabot.reformSetback"></label><input id="reform-setback" type="number" min="0" max="20" step="0.5" value="3" required></div>
<div class="field"><label for="reform-coverage" data-i18n-key="affordabot.reformCoverage"></label><input id="reform-coverage" type="number" min="10" max="90" step="1" value="60" required></div>
<button id="scan-button" class="action action-primary" type="submit" disabled data-i18n-key="affordabot.scan"></button>
<p class="form-note" data-i18n-key="affordabot.searchNote"></p>
</form>
<p id="status" class="notice" role="status" aria-live="polite" data-i18n-key="affordabot.start"></p>
<div class="workspace">
<aside class="card opportunity-panel"><div class="panel-heading"><h2 data-i18n-key="affordabot.opportunities"></h2><span class="badge" data-i18n-key="affordabot.research"></span></div><div id="candidate-list" class="candidate-list"></div><p id="empty-list" class="empty" data-i18n-key="affordabot.empty"></p><details class="saved-panel"><summary data-i18n-key="affordabot.savedDrafts"></summary><div id="saved-list" class="saved-list"></div></details></aside>
<section class="site-panel">
<div class="card map-card"><div class="panel-heading"><span data-i18n-key="affordabot.siteMap"></span><button type="button" id="map-search" class="action action-quiet" data-i18n-key="affordabot.searchMap"></button></div><div id="site-map" class="site-map"></div><div class="map-caption"><span class="legend-ground" data-i18n-key="affordabot.parcel"></span><span class="legend-building" data-i18n-key="affordabot.building"></span><small data-i18n-key="affordabot.schematic"></small></div></div>
<div id="site-empty" class="card empty-site"><h2 data-i18n-key="affordabot.emptyTitle"></h2><p data-i18n-key="affordabot.emptyBody"></p></div>
<article id="site-detail" class="card detail-card" hidden>
<div class="panel-heading"><div><p id="site-id" class="eyebrow"></p><h2 id="site-name"></h2></div><span class="badge" data-i18n-key="affordabot.research"></span></div>
<div id="site-metrics" class="site-metrics"></div>
<div class="section-heading"><h3 data-i18n-key="affordabot.compare"></h3><label class="sr-only" for="variant" data-i18n-key="affordabot.variant"></label><select id="variant"></select></div>
<div class="table-scroll"><table><thead><tr><th scope="col" data-i18n-key="affordabot.scenario"></th><th scope="col" data-i18n-key="affordabot.homes"></th><th scope="col" data-i18n-key="affordabot.rent"></th><th scope="col" data-i18n-key="affordabot.gfa"></th></tr></thead><tbody id="comparison"></tbody></table></div>
<p class="form-note" data-i18n-key="affordabot.baselineNote"></p>
<section class="detail-section"><h3 data-i18n-key="affordabot.planning"></h3><p id="planning-context"></p><ul id="planning-changes"></ul><a id="rule-link" target="_blank" rel="noopener noreferrer" data-i18n-key="affordabot.ruleSource"></a><p class="form-note" data-i18n-key="affordabot.planningNote"></p></section>
<section class="detail-section"><h3 data-i18n-key="affordabot.affordability"></h3><div id="finance-summary" class="notice"></div><dl id="cost-breakdown" class="cost-breakdown"></dl><p class="form-note" data-i18n-key="affordabot.financeNote"></p></section>
<details class="detail-section" id="assumptions-panel" open><summary data-i18n-key="affordabot.assumptions"></summary><p class="form-note" data-i18n-key="affordabot.assumptionNote"></p><form id="assumptions-form" class="assumption-grid"></form></details>
<section class="detail-section"><h3 data-i18n-key="affordabot.evidence"></h3><p id="transit-evidence"></p><ul id="evidence-gaps" class="evidence-list"></ul></section>
<section class="detail-section"><h3 data-i18n-key="affordabot.proposalDraft"></h3><label class="field" for="review-note"><span data-i18n-key="affordabot.reviewNote"></span><textarea id="review-note" rows="3" maxlength="3000"></textarea></label><div class="actions"><button type="button" id="save-draft" class="action action-primary" data-i18n-key="affordabot.saveDraft"></button><button type="button" id="open-design" class="action" data-i18n-key="affordabot.openDesign"></button><button type="button" id="export-draft" class="action" data-i18n-key="affordabot.export"></button></div><p class="form-note" data-i18n-key="affordabot.localDrafts"></p></section>
<section class="detail-section"><div class="section-heading"><h3 data-i18n-key="affordabot.publicPost"></h3><button type="button" id="copy-post" class="action action-quiet" data-i18n-key="affordabot.copy"></button></div><p id="post-draft" class="draft-text"></p><p class="form-note" data-i18n-key="affordabot.postNote"></p></section>
<details class="detail-section"><summary data-i18n-key="affordabot.authorityDraft"></summary><p class="form-note" data-i18n-key="affordabot.authorityNote"></p><p id="authority-draft" class="draft-text"></p></details>
</article>
</section>
</div>
<footer class="footer"><span data-i18n-key="affordabot.footer"></span><a href="https://help.x.com/en/rules-and-policies/x-automation" target="_blank" rel="noopener noreferrer" data-i18n-key="affordabot.xRules"></a></footer>
</main></body></html>
