<!doctype html>
<!-- Where OpenStreetMap's sign-in returns (osm/osm-account.js): hands the code to the app's page and closes. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Consensus Builder · Signing in with OpenStreetMap</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/primitives.css">
    <link rel="stylesheet" href="css/page-chrome.css">
    <link rel="stylesheet" href="css/osm-callback.css">
</head>
<body class="cb-page">
    <header class="cb-page-header">
        <span class="cb-page-header__brand"><img class="cb-page-header__logo" src="images/consensus-builder-logo.png" alt="" width="28" height="28"><span>Consensus Builder</span></span>
        <div class="cb-page-header__title"><h1>Signing in with OpenStreetMap</h1></div>
        <a class="cb-link cb-back-link" href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back to the map</a>
    </header>
    <main class="osm-callback">
        <p id="osm-callback-status" role="status">Signing in with OpenStreetMap…</p>
    </main>
    <script src="js/osm/osm-callback.js"></script>
</body>
</html>
